<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Thank You - Coral Medicine</title>
    <!-- External CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header section -->
    <div class="header-container">
        <div class="head-left">
            <img src="images/coral_med_logo.webp"
                 alt="Coral Medicine logo"
                 class="logo-size">
        </div>
        <div class="head-middle">
            <h1>Coral Medicine</h1>
        </div>
        <div class="head-right">
            Today's date:
            <span id="today">Date goes here</span>
        </div>
    </div>
    <!-- Thank you message -->
    <div class="thankyou-container">
        <h2>Thank you for your submission.</h2>
        <p>
            We will be contacting you shortly.
        </p>
        <a href="homework3.html">Return to Registration Form</a>
    </div>
    <!-- Footer section -->
    <footer class="footer-container">
        <p>&copy; 2026 Coral Medicine. All rights reserved.</p>
        <a href="mailto:contact@coralmedicine.com">
            Contact Us
        </a>
    </footer>
    <!-- Dynamic date -->
    <script>
        document.getElementById("today").innerHTML =
            new Date().toLocaleDateString("en-US", {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric"
            });
    </script>
    <!-- End of page-->
</body>
</html>
